spring:
  application.name: indicators-service
  datasource:
    url: ${INDICATORS_DB_URL:jdbc:sqlserver://localhost:1434;databaseName=operational_indicators;encrypt=true;trustServerCertificate=true}
    username: ${INDICATORS_DB_USER:sa}
    password: ${INDICATORS_DB_PASSWORD}
  jpa: { open-in-view: false, hibernate.ddl-auto: validate }
  flyway.enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_INDICATORS_GROUP:indicators-service-v1}
      enable-auto-commit: false
  security.oauth2.resourceserver.jwt.issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/operational-requests}
server.port: ${INDICATORS_SERVICE_PORT:8082}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
