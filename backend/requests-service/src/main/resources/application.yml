spring:
  application.name: requests-service
  datasource:
    url: ${REQUESTS_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=operational_requests;encrypt=true;trustServerCertificate=true}
    username: ${REQUESTS_DB_USER:sa}
    password: ${REQUESTS_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway:
    enabled: true
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security.oauth2.resourceserver.jwt.issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/operational-requests}
server.port: ${REQUESTS_SERVICE_PORT:8081}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
springdoc.swagger-ui.path: /swagger-ui.html
