apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "operational-requests.fullname" . }}-indicators
  labels:
    {{- include "operational-requests.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.indicatorsService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: indicators-service
      {{- include "operational-requests.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: indicators-service
        {{- include "operational-requests.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "operational-requests.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.global.securityContext | nindent 8 }}
      containers:
        - name: indicators-service
          image: {{ include "operational-requests.image" .Values.images.indicatorsService | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.indicatorsService.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "operational-requests.fullname" . }}-indicators-config
            - configMapRef:
                name: {{ include "operational-requests.fullname" . }}-runtime
          env:
            - name: INDICATORS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "operational-requests.secretName" . }}
                  key: indicators-db-password
          resources:
            {{- toYaml .Values.indicatorsService.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
