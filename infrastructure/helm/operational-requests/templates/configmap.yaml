apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "operational-requests.fullname" . }}-runtime
  labels:
    {{- include "operational-requests.labels" . | nindent 4 }}
data:
  CORS_ALLOWED_ORIGINS: {{ .Values.cors.allowedOrigins | quote }}
  FRONTEND_CONFIGURATION_NOTE: "Frontend URLs are build-time values; rebuild images for environment changes."
