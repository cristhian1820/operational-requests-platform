{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "operational-requests.secretName" . }}
  labels:
    {{- include "operational-requests.labels" . | nindent 4 }}
type: Opaque
stringData:
  requests-db-password: {{ required "secrets.data.requestsDbPassword is required when secrets.create=true" .Values.secrets.data.requestsDbPassword | quote }}
  indicators-db-password: {{ required "secrets.data.indicatorsDbPassword is required when secrets.create=true" .Values.secrets.data.indicatorsDbPassword | quote }}
{{- end }}
