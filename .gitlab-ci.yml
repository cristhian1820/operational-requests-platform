workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - when: never

stages:
  - validate
  - test
  - acceptance
  - build
  - security
  - package

default:
  interruptible: true
  timeout: 30m

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_DRIVER: overlay2
  HELM_VERSION: "3.17.3"
  TRIVY_VERSION: "0.58.1"

ci_yaml:
  stage: validate
  image: python:3.13.1-alpine3.21
  script:
    - pip install --no-cache-dir PyYAML==6.0.2
    - python tests/ci/validate-gitlab-ci.py
  rules:
    - when: always

frontend_quality:
  stage: test
  image: node:24.12.0-alpine3.23
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: npm-v1
    paths:
      - frontend/.npm/
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run build
    - npm run build-storybook
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - frontend/requests-mfe/storybook-static/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

backend_tests:
  stage: test
  image: maven:3.9.11-eclipse-temurin-21
  cache:
    key:
      files:
        - pom.xml
        - backend/pom.xml
      prefix: maven-v1
    paths:
      - .m2/repository/
  script:
    - chmod +x mvnw
    - ./mvnw clean test -Dmaven.repo.local="$CI_PROJECT_DIR/.m2/repository"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - backend/**/target/surefire-reports/TEST-*.xml
    paths:
      - backend/**/target/surefire-reports/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

helm_validate:
  stage: validate
  image:
    name: alpine/helm:3.17.3
    entrypoint: [""]
  script:
    - helm lint infrastructure/helm/operational-requests
    - helm template operational-requests infrastructure/helm/operational-requests -f infrastructure/helm/operational-requests/values-dev.yaml > helm-rendered.yaml
    - '! grep -Eiq "(eyJ[a-zA-Z0-9_-]{20,}|BEGIN (RSA|OPENSSH|PRIVATE)|client_secret|refresh_token|<no value>|null$)" helm-rendered.yaml'
  artifacts:
    expire_in: 7 days
    paths:
      - helm-rendered.yaml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

karate_acceptance:
  stage: acceptance
  image: docker:27.4.1
  services:
    - name: docker:27.4.1-dind
      alias: docker
  variables:
    COMPOSE_PROJECT_NAME: acceptance-${CI_PIPELINE_ID}
  before_script:
    - apk add --no-cache bash curl openjdk21-jre maven
    - until docker info >/dev/null 2>&1; do sleep 2; done
  script:
    - docker compose --env-file .env.example up --build -d
    - |
      required_services="sqlserver-operational sqlserver-analytics kafka keycloak requests-service indicators-service requests-mfe shell"
      for attempt in $(seq 1 60); do
        all_healthy=true
        for service in $required_services; do
          container_id=$(docker compose ps -q "$service")
          health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || true)
          if [ "$health" != "healthy" ]; then all_healthy=false; fi
        done
        if [ "$all_healthy" = true ]; then break; fi
        sleep 5
      done
      test "$all_healthy" = true
    - export COMPOSE_NETWORK="$(docker inspect "$(docker compose ps -q requests-service)" --format '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' | head -n 1 | tr -d '\r')"
    - test -n "$COMPOSE_NETWORK"
    - docker run --rm --network "$COMPOSE_NETWORK" curlimages/curl:8.11.1 --fail --silent http://requests-service:8081/actuator/health
    - docker run --rm --network "$COMPOSE_NETWORK" curlimages/curl:8.11.1 --fail --silent http://indicators-service:8082/actuator/health
    - docker run --rm --network "$COMPOSE_NETWORK" curlimages/curl:8.11.1 --fail --silent http://shell:8080/
    - docker run --rm --network "$COMPOSE_NETWORK" curlimages/curl:8.11.1 --fail --silent http://requests-mfe:8080/remoteEntry.js >/dev/null
    - mkdir -p ci-karate-context
    - cp pom.xml mvnw ci-karate-context/
    - cp -R .mvn tests ci-karate-context/
    - |
      cat > ci-karate-context/Dockerfile <<'EOF'
      FROM maven:3.9.11-eclipse-temurin-21
      WORKDIR /workspace
      COPY . .
      RUN chmod +x mvnw
      ENTRYPOINT ["./mvnw"]
      EOF
    - docker build --file ci-karate-context/Dockerfile --tag karate-runner:$CI_PIPELINE_ID ci-karate-context
    - |
      set +e
      docker run --name karate-runner-$CI_PIPELINE_ID --network "$COMPOSE_NETWORK" karate-runner:$CI_PIPELINE_ID -Pacceptance -pl tests/karate -am test -Drequests.api.url=http://requests-service:8081 -Dkeycloak.url=http://keycloak:8080
      result=$?
      mkdir -p tests/karate/target
      docker cp karate-runner-$CI_PIPELINE_ID:/workspace/tests/karate/target/. tests/karate/target/ 2>/dev/null || true
      docker rm karate-runner-$CI_PIPELINE_ID >/dev/null 2>&1 || true
      exit $result
  after_script:
    - docker rm -f karate-runner-$CI_PIPELINE_ID >/dev/null 2>&1 || true
    - docker compose --env-file .env.example down --remove-orphans || true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - tests/karate/target/karate-reports/
      - tests/karate/target/surefire-reports/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

docker_build:
  stage: build
  image: docker:27.4.1
  services:
    - name: docker:27.4.1-dind
      alias: docker
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 2; done
  script:
    - docker build --file backend/requests-service/Dockerfile --tag requests-service:$CI_COMMIT_SHA .
    - docker build --file backend/indicators-service/Dockerfile --tag indicators-service:$CI_COMMIT_SHA .
    - docker build --file frontend/shell/Dockerfile --tag shell:$CI_COMMIT_SHA --build-arg KEYCLOAK_URL="${KEYCLOAK_URL:-http://localhost:8080}" --build-arg KEYCLOAK_REALM="${KEYCLOAK_REALM:-operational-requests}" --build-arg KEYCLOAK_CLIENT_ID="${KEYCLOAK_CLIENT_ID:-operational-requests-web}" --build-arg REQUESTS_API_URL="${REQUESTS_API_URL:-http://localhost:18081}" --build-arg INDICATORS_API_URL="${INDICATORS_API_URL:-http://localhost:8082}" --build-arg REQUESTS_MFE_URL="${REQUESTS_MFE_URL:-http://localhost:4201/remoteEntry.js}" .
    - docker build --file frontend/requests-mfe/Dockerfile --tag requests-mfe:$CI_COMMIT_SHA --build-arg KEYCLOAK_URL="${KEYCLOAK_URL:-http://localhost:8080}" --build-arg KEYCLOAK_REALM="${KEYCLOAK_REALM:-operational-requests}" --build-arg KEYCLOAK_CLIENT_ID="${KEYCLOAK_CLIENT_ID:-operational-requests-web}" --build-arg REQUESTS_API_URL="${REQUESTS_API_URL:-http://localhost:18081}" --build-arg INDICATORS_API_URL="${INDICATORS_API_URL:-http://localhost:8082}" --build-arg REQUESTS_MFE_URL="${REQUESTS_MFE_URL:-http://localhost:4201/remoteEntry.js}" .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

security_scan:
  stage: security
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .
    - trivy fs --scanners vuln --severity UNKNOWN,LOW,MEDIUM --exit-code 0 --format table --no-progress . | tee trivy-informational.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - trivy-informational.txt
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

docker_publish:
  stage: package
  image: docker:27.4.1
  services:
    - name: docker:27.4.1-dind
      alias: docker
  needs: [docker_build]
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 2; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - export IMAGE_PREFIX="$CI_REGISTRY_IMAGE"
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --file backend/requests-service/Dockerfile --tag "$IMAGE_PREFIX/requests-service:$IMAGE_TAG" .
    - docker build --file backend/indicators-service/Dockerfile --tag "$IMAGE_PREFIX/indicators-service:$IMAGE_TAG" .
    - docker build --file frontend/shell/Dockerfile --tag "$IMAGE_PREFIX/shell:$IMAGE_TAG" --build-arg KEYCLOAK_URL="${KEYCLOAK_URL:-http://localhost:8080}" --build-arg KEYCLOAK_REALM="${KEYCLOAK_REALM:-operational-requests}" --build-arg KEYCLOAK_CLIENT_ID="${KEYCLOAK_CLIENT_ID:-operational-requests-web}" --build-arg REQUESTS_API_URL="${REQUESTS_API_URL:-http://localhost:18081}" --build-arg INDICATORS_API_URL="${INDICATORS_API_URL:-http://localhost:8082}" --build-arg REQUESTS_MFE_URL="${REQUESTS_MFE_URL:-http://localhost:4201/remoteEntry.js}" .
    - docker build --file frontend/requests-mfe/Dockerfile --tag "$IMAGE_PREFIX/requests-mfe:$IMAGE_TAG" --build-arg KEYCLOAK_URL="${KEYCLOAK_URL:-http://localhost:8080}" --build-arg KEYCLOAK_REALM="${KEYCLOAK_REALM:-operational-requests}" --build-arg KEYCLOAK_CLIENT_ID="${KEYCLOAK_CLIENT_ID:-operational-requests-web}" --build-arg REQUESTS_API_URL="${REQUESTS_API_URL:-http://localhost:18081}" --build-arg INDICATORS_API_URL="${INDICATORS_API_URL:-http://localhost:8082}" --build-arg REQUESTS_MFE_URL="${REQUESTS_MFE_URL:-http://localhost:4201/remoteEntry.js}" .
    - docker push "$IMAGE_PREFIX/requests-service:$IMAGE_TAG"
    - docker push "$IMAGE_PREFIX/indicators-service:$IMAGE_TAG"
    - docker push "$IMAGE_PREFIX/shell:$IMAGE_TAG"
    - docker push "$IMAGE_PREFIX/requests-mfe:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
