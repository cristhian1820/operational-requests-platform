server { listen 8080; server_name _; root /usr/share/nginx/html; location = /remoteEntry.js { add_header Cache-Control "no-store"; try_files $uri =404; } location ~* \.(js|css|woff2)$ { add_header Cache-Control "public,max-age=31536000,immutable"; try_files $uri =404; } location / { try_files $uri $uri/ /index.html; } }
